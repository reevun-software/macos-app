name: Release

# Builds the macOS disk image (one universal app for Intel and Apple silicon) and publishes it as a GitHub release.
# Runs on every change here and on every change to app-core (app-core sends
# "core-updated").
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: macos-app
      - uses: actions/checkout@v5
        with:
          repository: reevun-software/app-core
          token: ${{ secrets.DESKTOP_CI_TOKEN }}
          path: app-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Version
        working-directory: macos-app
        run: npm version "${{ env.VERSION }}" --no-git-tag-version
      - name: Install
        working-directory: macos-app
        run: npm ci
      - name: Build
        working-directory: macos-app
        run: npm run dist
      # Always Reevun.dmg, so .../releases/latest/download/Reevun.dmg is a permanent download link.
      - name: Publish
        working-directory: macos-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ env.VERSION }}" --title "Reevun ${{ env.VERSION }}" --notes "" --latest
          release/Reevun.dmg
